.sx-root *,.sx-root *::before,.sx-root *::after { box-sizing:border-box; margin:0; }
.sx-root button { font-family:inherit; cursor:pointer; }
.sx-root :focus-visible { outline:2px solid var(--b); outline-offset:2px; }
.sx-loading { min-height:100vh; display:grid; place-items:center; }

/* auth */
.sx-auth { display:grid; grid-template-columns: minmax(320px, 5fr) 7fr; min-height:100vh; }
.sx-auth-side { background:var(--ink); color:#fff; padding:56px 48px; display:flex; flex-direction:column; gap:28px; }
.sx-auth-brand { display:flex; align-items:center; gap:14px; }
.sx-auth-eixo { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--y); font-weight:500; }
.sx-auth-prod { font-size:22px; font-weight:500; }
.sx-auth-title { font-size:34px; font-weight:500; line-height:1.12; letter-spacing:-.01em; max-width:380px; margin-top:auto; }
.sx-auth-list { padding-left:18px; color:#D8D8D8; display:grid; gap:6px; }
.sx-auth-note { font-size:12.5px; color:#9A9A9A; margin-top:auto; }
.sx-auth-main { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 24px; position:relative; }
.sx-back { position:absolute; top:24px; left:24px; display:inline-flex; align-items:center; gap:4px; border:0; background:none; color:var(--soft); font-size:14px; }
.sx-back:hover { color:var(--ink); }
.sx-auth-card { width:100%; max-width:440px; }
.sx-step { font-size:12.5px; color:var(--soft); margin-bottom:6px; }
.sx-divider { display:flex; align-items:center; gap:12px; color:var(--soft); font-size:13px; margin:22px 0; }
.sx-divider::before,.sx-divider::after { content:""; flex:1; height:1px; background:var(--line); }
.sx-auth-card > .sx-btn { width:100%; }
.sx-demo-cred { font-size:12.5px; color:var(--soft); text-align:center; margin-top:8px; }
.sx-switch { margin-top:22px; font-size:14px; color:var(--soft); text-align:center; }
.sx-pass { position:relative; display:block; }
.sx-pass .sx-icon-btn { position:absolute; right:6px; top:50%; transform:translateY(-50%); }

/* tipografia */
.sx-h1 { font-size:26px; font-weight:500; letter-spacing:-.01em; line-height:1.2; }
.sx-h3 { font-size:15px; font-weight:600; margin:18px 0 10px; }
.sx-card > .sx-h3:first-child { margin-top:0; }
.sx-sub { color:var(--soft); margin-top:4px; }
.sx-p { color:var(--ink); }
.sx-muted { color:var(--soft); }
.sx-small { font-size:12.5px; }
.sx-pos { color:var(--g); } .sx-neg { color:var(--r); }
.sx-error { color:var(--r); font-size:13.5px; }
.sx-link { border:0; background:none; color:var(--b); font-weight:500; padding:0; font-size:inherit; text-align:left; }
.sx-link:hover { text-decoration:underline; }
.sx-mt { margin-top:14px; } .sx-mb { margin-bottom:14px; }

/* formul\xE1rios */
.sx-form { display:grid; gap:14px; margin-top:20px; }
.sx-card .sx-form { margin-top:0; }
.sx-field { display:grid; gap:5px; }
.sx-label { font-size:13px; font-weight:500; color:var(--ink); }
.sx-hint { font-size:12px; color:var(--soft); }
.sx-input { width:100%; font:inherit; font-size:14.5px; padding:9px 11px; border:1px solid #D6D6D2; border-radius:6px; background:#fff; color:var(--ink); }
.sx-input:focus { outline:none; border-color:var(--ink); }
.sx-textarea { min-height:84px; resize:vertical; }
.sx-input-sm { width:auto; padding:7px 10px; font-size:13.5px; }
.sx-input-xs { width:84px; padding:5px 8px; text-align:right; }
.sx-check { display:flex; align-items:flex-start; gap:8px; font-size:14px; cursor:pointer; }
.sx-check input { margin-top:3px; accent-color:var(--ink); }
.sx-grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.sx-grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
.sx-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px; }
.sx-row-between { display:flex; justify-content:space-between; align-items:center; gap:8px; }
.sx-seg { display:inline-flex; border:1px solid #D6D6D2; border-radius:6px; overflow:hidden; width:fit-content; }
.sx-seg-btn { border:0; background:#fff; padding:8px 18px; font-size:14px; }
.sx-seg-btn.is-on { background:var(--ink); color:#fff; }

/* bot\xF5es */
.sx-btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; font-weight:500; font-size:14px; padding:9px 16px; border-radius:6px; border:1px solid transparent; white-space:nowrap; transition:background .15s; }
.sx-btn:disabled { opacity:.4; cursor:not-allowed; }
.sx-btn-sm { padding:6px 11px; font-size:13px; }
.sx-btn-ink { background:var(--ink); color:#fff; } .sx-btn-ink:hover:not(:disabled) { background:#333; }
.sx-btn-yellow { background:var(--y); color:var(--ink); } .sx-btn-yellow:hover:not(:disabled) { background:#F2C935; }
.sx-btn-outline { background:#fff; color:var(--ink); border-color:#CFCFCB; } .sx-btn-outline:hover:not(:disabled) { border-color:var(--ink); }
.sx-btn-danger { background:var(--r); color:#fff; }
.sx-icon-btn { display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border:0; border-radius:6px; background:none; color:var(--soft); }
.sx-icon-btn:hover:not(:disabled) { background:#F1F1EE; color:var(--ink); }
.sx-icon-btn:disabled { opacity:.3; cursor:not-allowed; }

/* layout do app */
.sx-app { display:grid; grid-template-columns:232px 1fr; min-height:100vh; }
.sx-side { border-right:1px solid var(--line); padding:18px 12px; display:flex; flex-direction:column; gap:18px; position:sticky; top:0; height:100vh; background:#fff; }
.sx-side-brand { display:flex; align-items:center; gap:10px; padding:4px 8px 8px; }
.sx-side-brand strong { display:block; font-weight:600; font-size:15px; line-height:1.1; }
.sx-side-brand span { font-size:12px; color:var(--soft); }
.sx-nav { display:grid; gap:2px; }
.sx-nav-item { display:flex; align-items:center; gap:10px; border:0; background:none; padding:9px 10px; border-radius:6px; font-size:14px; color:#3A3A3A; text-align:left; position:relative; }
.sx-nav-item:hover { background:#F4F4F1; }
.sx-nav-item.is-on { background:#F4F4F1; color:var(--ink); font-weight:500; }
.sx-nav-item.is-on::before { content:""; position:absolute; left:-12px; top:6px; bottom:6px; width:4px; background:var(--y); border-radius:0 3px 3px 0; }
.sx-side-foot { margin-top:auto; border-top:1px solid var(--line); padding:14px 8px 0; }
.sx-plan { font-weight:500; font-size:13.5px; } .sx-plan-sub { font-size:12px; color:var(--soft); }
.sx-main { min-width:0; background:var(--bg); }
.sx-top { height:60px; display:flex; align-items:center; gap:12px; padding:0 28px; border-bottom:1px solid var(--line); background:#fff; position:sticky; top:0; z-index:5; }
.sx-top-org { font-weight:500; }
.sx-top-user { margin-left:auto; display:flex; align-items:center; gap:10px; }
.sx-top-name { font-size:13.5px; color:var(--soft); }
.sx-avatar { width:30px; height:30px; border-radius:50%; background:var(--y); display:inline-grid; place-items:center; font-size:12px; font-weight:600; flex:none; }
.sx-avatar-sm { width:28px; height:28px; background:#EFEFEB; }
.sx-menu-btn { display:none; }
.sx-content { padding:28px; max-width:1240px; }
.sx-pagehead { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
.sx-pagehead-actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.sx-search { display:inline-flex; align-items:center; gap:6px; border:1px solid #D6D6D2; border-radius:6px; padding:0 10px; background:#fff; color:var(--soft); }
.sx-search input { border:0; outline:0; padding:8px 0; font:inherit; font-size:14px; min-width:190px; }

/* cards e tabelas */
.sx-card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:20px; }
.sx-flush { padding:0; overflow-x:auto; }
.sx-card-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; }
.sx-card-head h2 { font-size:15px; font-weight:600; }
.sx-kpis { display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-bottom:16px; }
.sx-kpis-4 { grid-template-columns:repeat(4,1fr); }
.sx-kpi { background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px 16px; display:grid; gap:4px; }
.sx-kpi span { font-size:12.5px; color:var(--soft); }
.sx-kpi strong { font-size:18px; font-weight:500; }
.sx-grid-dash { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.sx-span2 { grid-column:1 / -1; }
.sx-table { width:100%; border-collapse:collapse; font-size:14px; }
.sx-table th { text-align:left; font-weight:500; font-size:12.5px; color:var(--soft); padding:10px 14px; border-bottom:1px solid var(--line); white-space:nowrap; background:#FCFCFB; }
.sx-table td { padding:11px 14px; border-bottom:1px solid #F0F0ED; vertical-align:middle; }
.sx-table tr:last-child td { border-bottom:0; }
.sx-card:not(.sx-flush) .sx-table th { background:none; padding-left:0; }
.sx-card:not(.sx-flush) .sx-table td { padding-left:0; }
.sx-table .r { text-align:right; white-space:nowrap; }
.sx-table tr.is-click { cursor:pointer; } .sx-table tr.is-click:hover td { background:#FAFAF7; }
.sx-actions { white-space:nowrap; width:1%; }
.sx-total td { font-weight:600; border-top:2px solid var(--ink); }
.sx-badge { display:inline-flex; font-size:12px; font-weight:500; padding:2px 9px; border-radius:999px; white-space:nowrap; }
.sx-badge-gray { background:#EFEFEB; color:#4A4A4A; }
.sx-badge-blue { background:#E3EBFA; color:#2A58B3; }
.sx-badge-green { background:#E2F0E5; color:#2F6E3E; }
.sx-badge-yellow { background:#FCF0C2; color:#7A5C00; }
.sx-badge-red { background:#F7E1DD; color:#9A2E20; }
.sx-list { list-style:none; padding:0; display:grid; }
.sx-list li { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid #F0F0ED; }
.sx-list li:last-child { border-bottom:0; }
.sx-list li.is-click { cursor:pointer; } .sx-list li.is-click:hover { background:#FAFAF7; }
.sx-list li > span:nth-child(2) { flex:1; min-width:0; }
.sx-list strong { display:block; font-weight:500; }
.sx-list em { font-style:normal; font-size:12.5px; color:var(--soft); }
.sx-date { font-weight:600; font-size:13px; background:#F4F4F1; border-radius:6px; padding:6px 8px; flex:none; }
.sx-flow { display:inline-grid; place-items:center; width:24px; height:24px; border-radius:6px; flex:none; vertical-align:middle; }
.sx-flow.in { background:#E2F0E5; color:var(--g); } .sx-flow.out { background:#F7E1DD; color:var(--r); }
.sx-amount { font-weight:500; white-space:nowrap; }
.sx-empty { display:grid; justify-items:center; gap:8px; padding:56px 20px; text-align:center; color:var(--soft); background:#fff; border:1px dashed #D6D6D2; border-radius:8px; }
.sx-empty-title { color:var(--ink); font-weight:500; font-size:16px; }
.sx-tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:16px; flex-wrap:wrap; }
.sx-tab { border:0; background:none; padding:9px 12px; font-size:14px; color:var(--soft); border-bottom:2px solid transparent; margin-bottom:-1px; }
.sx-tab span { font-size:12px; color:#9A9A9A; margin-left:4px; }
.sx-tab.is-on { color:var(--ink); border-bottom-color:var(--ink); font-weight:500; }
.sx-chip { border:1px solid #D6D6D2; background:#fff; border-radius:999px; padding:5px 12px; font-size:13px; }
.sx-chip.is-on { background:var(--ink); color:#fff; border-color:var(--ink); }
.sx-paid { border:1px solid #D6D6D2; background:#fff; border-radius:999px; padding:3px 10px; font-size:12.5px; }
.sx-paid.is-on { background:#E2F0E5; border-color:#E2F0E5; color:#2F6E3E; }

/* or\xE7amento e editores */
.sx-orc { display:grid; grid-template-columns:1fr 300px; gap:16px; align-items:start; }
.sx-summary { position:sticky; top:76px; display:grid; gap:8px; }
.sx-sum-row { display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:14px; }
.sx-sum-total { display:flex; justify-content:space-between; align-items:baseline; border-top:2px solid var(--ink); padding-top:10px; margin-top:4px; }
.sx-sum-total strong { font-size:22px; font-weight:500; }
.sx-sum-actions { display:grid; gap:8px; margin-top:12px; }
.sx-bar-row { display:grid; grid-template-columns:96px 1fr 48px; align-items:center; gap:8px; font-size:12.5px; color:var(--soft); }
.sx-bar { display:block; height:6px; background:#EFEFEB; border-radius:3px; overflow:hidden; min-width:80px; }
.sx-bar i { display:block; height:100%; background:var(--ink); }
.sx-bar i.over { background:var(--r); }
.sx-items { display:grid; gap:6px; }
.sx-items-head,.sx-items-row { display:grid; grid-template-columns:130px 1fr 64px 92px 110px 110px 34px; gap:8px; align-items:center; }
.sx-items-head { font-size:12px; color:var(--soft); }
.sx-items-row .sx-input { padding:7px 8px; font-size:14px; }
.sx-num { font-variant-numeric:tabular-nums; }
.r { text-align:right; }
.sx-crono { display:grid; grid-template-columns:120px 1fr 34px; gap:8px; margin-bottom:6px; }
.sx-pre { white-space:pre-wrap; font-family:'Outfit',sans-serif; font-size:13.5px; background:#FAFAF8; border:1px solid var(--line); border-radius:6px; padding:18px; line-height:1.6; max-height:520px; overflow:auto; }
.sx-jobgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
.sx-jobcard { text-align:left; background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px; display:grid; gap:6px; font:inherit; color:inherit; }
.sx-jobcard:hover { border-color:var(--ink); }
.sx-jobcard h3 { font-size:17px; font-weight:500; }
.sx-jobcard-foot { display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--soft); border-top:1px solid #F0F0ED; padding-top:10px; margin-top:4px; }
.sx-jobcard-foot strong { color:var(--ink); font-weight:500; }
.sx-fluxbars { width:40%; }
.sx-fluxbars span { display:block; height:7px; border-radius:3px; margin:2px 0; min-width:2px; }
.sx-fluxbars .in { background:var(--g); } .sx-fluxbars .out { background:var(--ink); }

/* modal e documento */
.sx-overlay { position:fixed; inset:0; background:rgba(17,17,17,.42); display:grid; place-items:center; padding:20px; z-index:50; }
.sx-modal { background:#fff; border-radius:10px; width:100%; max-width:560px; max-height:calc(100vh - 40px); display:flex; flex-direction:column; }
.sx-modal-wide { max-width:760px; }
.sx-modal-head { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line); }
.sx-modal-head h3 { font-size:17px; font-weight:500; }
.sx-modal-body { padding:20px; overflow:auto; }
.sx-modal-body .sx-form { margin-top:0; }
.sx-modal-foot { display:flex; justify-content:flex-end; gap:8px; padding:14px 20px; border-top:1px solid var(--line); }
.sx-doc { display:grid; gap:10px; }
.sx-doc-head { display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid var(--ink); padding-bottom:12px; }
.sx-doc-org { font-weight:600; font-size:16px; }
.sx-doc-title { font-size:22px; font-weight:500; margin-top:8px; }
.sx-doc-table { margin:8px 0; }

@media (max-width: 1100px) {
  .sx-kpis { grid-template-columns:repeat(3,1fr); }
  .sx-orc { grid-template-columns:1fr; } .sx-summary { position:static; }
}
@media (max-width: 860px) {
  .sx-auth { grid-template-columns:1fr; } .sx-auth-side { display:none; }
  .sx-app { grid-template-columns:1fr; }
  .sx-side { position:fixed; left:0; top:0; z-index:40; width:250px; transform:translateX(-100%); transition:transform .2s; }
  .sx-side.is-open { transform:none; box-shadow:0 0 0 100vmax rgba(0,0,0,.0); }
  .sx-scrim { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:30; }
  .sx-menu-btn { display:inline-flex; }
  .sx-top { padding:0 14px; } .sx-top-name { display:none; }
  .sx-content { padding:18px 14px; }
  .sx-grid-dash,.sx-grid2,.sx-grid3 { grid-template-columns:1fr; }
  .sx-kpis,.sx-kpis-4 { grid-template-columns:1fr 1fr; }
  .sx-items-head { display:none; }
  .sx-items-row { grid-template-columns:1fr 1fr; padding:10px; border:1px solid var(--line); border-radius:6px; }
  .sx-items-row > :nth-child(2) { grid-column:1 / -1; order:-1; }
}
/* navega\xE7\xE3o em grupos */
.sx-nav-group { margin-bottom:10px; }
.sx-nav-title { display:flex; align-items:center; gap:7px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:#8A8A86; padding:8px 12px 4px; }
.sx-nav-title i { width:9px; height:9px; border-radius:2px; display:inline-block; }
.sx-prods { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.sx-prod { display:flex; gap:10px; align-items:center; border:1px solid var(--line); border-radius:8px; padding:12px; cursor:pointer; }
.sx-prod.is-on { border-color:var(--ink); }
.sx-prod input { accent-color:var(--ink); }
.sx-prod span { display:grid; } .sx-prod em { font-style:normal; font-size:12px; color:var(--soft); }
/* gr\xE1ficos e indicadores */
.sx-chart svg, .sx-chart-svg { width:100%; height:auto; display:block; }
.sx-ax { font-size:11px; fill:#8A8A86; font-family:inherit; }
.sx-ax-b { fill:var(--ink); font-weight:500; }
.sx-legend { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12.5px; color:var(--soft); margin-top:6px; align-items:center; }
.sx-legend span { display:inline-flex; align-items:center; gap:6px; }
.sx-legend i { width:10px; height:10px; border-radius:2px; display:inline-block; }
.sx-legend i.ln { height:3px; width:16px; background:var(--b); border-radius:2px; }
.sx-legend strong { font-weight:500; color:var(--ink); margin-left:auto; }
.sx-metric em { font-style:normal; font-size:12px; color:var(--soft); }
.sx-metric-top { display:flex; justify-content:space-between; align-items:center; gap:6px; }
.sx-info { padding:2px; color:#8A8A86; }
.sx-explica { display:grid; gap:12px; }
.sx-reading { display:grid; gap:8px; padding-left:18px; margin:0; }
.sx-bar i.blue { background:var(--b); } .sx-bar i.green { background:var(--g); }
.sx-proj-bars { display:grid; grid-template-columns:auto 1fr; gap:6px 10px; align-items:center; font-size:12.5px; color:var(--soft); margin:10px 0; }
.sx-check-line { display:flex; align-items:center; gap:8px; padding:5px 0; }
.sx-done { text-decoration:line-through; color:#9A9A9A; }
.sx-ponte-tag { display:flex; align-items:center; gap:6px; font-size:13.5px; margin:-6px 0 14px; }
.sx-ponte-box { display:flex; justify-content:space-between; align-items:center; gap:14px; border:1px dashed #CFCFCB; border-radius:8px; padding:12px 14px; margin-bottom:16px; background:#FFFCEB; }
.sx-ponte-box p { margin:2px 0 0; }
.sx-pad { padding:14px; }
.sx-total td { font-weight:600; background:#FCFCFB; }
.sx-kanban { display:grid; grid-template-columns:repeat(6,minmax(170px,1fr)); gap:10px; overflow-x:auto; padding-bottom:6px; }
.sx-kcol { background:#F6F6F3; border-radius:8px; padding:10px; display:grid; gap:8px; align-content:start; min-height:120px; }
.sx-kcol-head { display:flex; justify-content:space-between; font-size:12.5px; font-weight:500; }
.sx-kcol-head em { font-style:normal; color:var(--soft); }
.sx-kcard { text-align:left; background:#fff; border:1px solid var(--line); border-radius:6px; padding:9px 10px; display:grid; gap:2px; font:inherit; font-size:13px; cursor:pointer; }
.sx-kcard:hover { border-color:var(--ink); }
.sx-kcard em { font-style:normal; font-size:12px; color:var(--soft); }
.sx-quotes { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px; }
.sx-quote { border:1px solid var(--line); border-radius:8px; padding:12px; display:grid; gap:6px; align-content:start; background:#fff; font:inherit; }
.sx-quote.is-on { border-color:var(--b); }
.sx-quote-v { font-size:18px; font-weight:500; }
.sx-quote em { font-style:normal; font-size:12.5px; color:var(--soft); }
.sx-quote-add { border-style:dashed; color:var(--soft); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; min-height:110px; }
/* boleto */
.sx-bank { display:flex; align-items:center; gap:7px; font-size:13px; color:var(--soft); background:#F6F6F3; border-radius:6px; padding:8px 10px; margin:0; }
.sx-bank.sx-pos { color:var(--g); background:#EEF6EF; }
.sx-linha { font-family:ui-monospace,Menlo,monospace; font-size:13.5px; background:#F6F6F3; border-radius:6px; padding:10px 12px; word-break:break-all; margin:6px 0 0; }
.sx-boleto-ok { display:grid; grid-template-columns:1fr 280px; gap:18px; align-items:start; }
.sx-timeline { list-style:none; padding:0; margin:14px 0 0; display:grid; gap:8px; font-size:13.5px; }
.sx-timeline span { color:var(--soft); margin-right:10px; }
.sx-spin { animation:sxspin 1s linear infinite; }
@keyframes sxspin { to { transform:rotate(360deg); } }
/* WhatsApp */
.sx-whats { display:grid; grid-template-columns:380px 1fr; gap:16px; align-items:start; }
.sx-whats-side { display:grid; gap:16px; }
.sx-phone { border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; height:620px; background:#EFEAE2; }
.sx-phone-sm { height:auto; max-height:360px; }
.sx-phone-head { display:flex; gap:10px; align-items:center; background:#0F5C4C; color:#fff; padding:10px 14px; font-size:13px; }
.sx-phone-head div { display:grid; } .sx-phone-head em { font-style:normal; font-size:11.5px; opacity:.8; }
.sx-phone-av { width:30px; height:30px; border-radius:50%; background:var(--y); color:var(--ink); display:grid; place-items:center; }
.sx-phone-body { flex:1; overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; gap:8px; }
.sx-bubble { max-width:86%; padding:7px 10px 18px; border-radius:8px; font-size:13.5px; white-space:pre-wrap; position:relative; box-shadow:0 1px 0 rgba(0,0,0,.06); line-height:1.4; }
.sx-bubble.in { background:#fff; align-self:flex-start; }
.sx-bubble.out { background:#D9FDD3; align-self:flex-end; }
.sx-bubble em { position:absolute; right:8px; bottom:3px; font-style:normal; font-size:10.5px; color:#7A7A76; }
.sx-typing { display:flex; gap:6px; align-items:center; padding-bottom:7px; color:var(--soft); }
.sx-phone-input { display:flex; gap:8px; padding:8px; background:#F0F0F0; }
.sx-phone-input input { flex:1; border:0; border-radius:20px; padding:9px 14px; font:inherit; font-size:14px; background:#fff; }
.sx-phone-input input:focus { outline:2px solid #0F5C4C; }
.sx-phone-input button { width:38px; height:38px; border-radius:50%; border:0; background:#0F5C4C; color:#fff; display:grid; place-items:center; cursor:pointer; }
.sx-chips-col { display:grid; gap:8px; }
.sx-chips-col .sx-chip { text-align:left; border-radius:8px; white-space:normal; }
.sx-feed li { align-items:flex-start; }
.sx-dot { width:8px; height:8px; border-radius:50%; background:#9A9A9A; margin-top:7px; flex:none; }
.sx-dot-boleto { background:var(--b); } .sx-dot-pagamento { background:var(--g); } .sx-dot-diaria { background:var(--y); }
.sx-dot-vencimento { background:var(--o); } .sx-dot-captacao { background:#7A5CC7; } .sx-dot-contrato { background:var(--ink); }
@media (max-width: 1100px) { .sx-whats { grid-template-columns:1fr; } .sx-kanban { grid-template-columns:repeat(6,200px); } }
@media (max-width: 760px) { .sx-boleto-ok, .sx-prods { grid-template-columns:1fr; } .sx-phone { height:520px; } }

  --paper: ${A.paper}; --ink: ${A.ink}; --ink-soft: ${A.inkSoft};
  --blue: ${A.blue}; --blue-light: ${A.blueLight}; --yellow: ${A.yellow};
  --orange: ${A.orange}; --green: ${A.green}; --green-deep: ${A.greenDeep};
  --green-light: ${A.greenLight}; --lilac: ${A.lilac}; --peach: ${A.peach};
  font-family: 'Outfit', system-ui, sans-serif;
  color: var(--ink); background: var(--paper); line-height: 1.6;
  -webkit-font-smoothing: antialiased; position: relative; overflow-x: hidden;
}
.cv-root *, .cv-root *::before, .cv-root *::after { box-sizing: border-box; margin: 0; }
.cv-root a { text-decoration: none; color: inherit; }
.cv-root :focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; border-radius: 6px; }
.cv-root button { font-family: inherit; }

.cv-container { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
.cv-section { padding: 92px 0; position: relative; content-visibility: auto; contain-intrinsic-size: auto 620px; }
.cv-section-top { padding-top: 64px; }
/* compensa o cabe\xE7alho fixo quando a rolagem vai at\xE9 uma \xE2ncora */
.cv-root [id] { scroll-margin-top: 92px; }

.cv-eyebrow {
  font-family: 'Outfit', system-ui, sans-serif; font-size: 13px; font-weight: 700;
  letter-spacing: .13em; text-transform: uppercase; color: var(--blue); margin-bottom: 14px;
}
.cv-eyebrow-light { color: rgba(255,255,255,.85); }
.cv-eyebrow-ink { color: var(--ink); }
.cv-eyebrow-onblue { color: var(--yellow); }
.cv-h2 {
  font-family: 'Outfit', system-ui, sans-serif; font-size: clamp(29px, 4.2vw, 44px);
  font-weight: 700; line-height: 1.1; letter-spacing: -0.025em; color: var(--ink); max-width: 660px;
}
.cv-h2-light { color: var(--paper); }
.cv-lead { font-size: 17px; color: var(--ink-soft); max-width: 580px; margin-top: 16px; }
.cv-lead-light { color: rgba(255,255,255,.85); }
.cv-split-head {
  display: grid; grid-template-columns: minmax(0,7fr) minmax(0,5fr); gap: 40px;
  align-items: end; margin-bottom: 44px;
}
.cv-list-head {
  display: flex; justify-content: space-between; align-items: flex-end; gap: 24px;
  flex-wrap: wrap; margin-bottom: 32px;
}
.cv-empty { font-size: 15px; color: var(--ink-soft); padding: 40px 0; text-align: center; }

.cv-corner-0 { border-radius: 6px; }
.cv-corner-1 { border-radius: 6px; }
.cv-corner-2 { border-radius: 6px; }
.cv-corner-3 { border-radius: 6px; }

.cv-reveal { opacity: 0; transform: translateY(14px); transition: opacity .38s ease-out, transform .38s cubic-bezier(.22,.8,.3,1); }
.cv-reveal.is-in { will-change: auto; }
.cv-reveal.is-in { opacity: 1; transform: none; }
.cv-fade-swap { animation: cvFade .45s ease; }
@keyframes cvFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* bot\xF5es */
.cv-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-family: 'Outfit', system-ui, sans-serif; font-weight: 600; font-size: 15px;
  padding: 12px 24px; border-radius: 999px; border: 2px solid transparent; cursor: pointer;
  transition: transform .18s ease, box-shadow .18s ease, background .18s ease, color .18s ease;
}
.cv-btn:hover { transform: translateY(-2px); }
.cv-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.cv-btn-lg { padding: 15px 30px; font-size: 16px; }
.cv-btn-sm { padding: 9px 18px; font-size: 14px; }
.cv-btn-block { width: 100%; }
.cv-root .cv-btn-ink { background: var(--ink); color: var(--paper); box-shadow: none; }
.cv-root .cv-btn-ink:hover { background: #0c1710; color: var(--paper); }
.cv-root .cv-btn-yellow { background: var(--yellow); color: var(--ink); box-shadow: none; }
.cv-root .cv-btn-yellow:hover { background: #ffdd58; color: var(--ink); }
.cv-root .cv-btn-paper { background: var(--paper); color: var(--ink); }
.cv-root .cv-btn-paper:hover { background: #fff; color: var(--ink); }
.cv-root .cv-btn-outline { border-color: var(--ink); color: var(--ink); background: transparent; }
.cv-root .cv-btn-outline:hover { background: rgba(17,17,17,.06); }
.cv-root .cv-btn-ghost { color: var(--ink); background: transparent; }
.cv-root .cv-btn-ghost:hover { background: rgba(17,17,17,.06); }
.cv-root .cv-textlink {
  display: inline-flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 700;
  font-family: 'Outfit', system-ui, sans-serif; color: var(--blue); margin-top: 4px;
}
.cv-root .cv-textlink:hover { text-decoration: underline; color: var(--blue); }
.cv-root .cv-inline-link { color: var(--blue); font-weight: 600; }
.cv-root .cv-inline-link:hover { text-decoration: underline; }

.cv-chip {
  display: inline-flex; align-items: center; gap: 5px; font-family: 'Outfit', system-ui, sans-serif;
  font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  padding: 5px 11px; border-radius: 999px; width: fit-content;
}
.cv-chip-blue { background: rgba(29,111,224,.12); color: var(--blue); }
.cv-chip-green { background: rgba(31,157,85,.14); color: var(--green); }
.cv-chip-orange { background: rgba(255,122,26,.15); color: #C85C0C; }
.cv-chip-ink { background: rgba(17,17,17,.09); color: var(--ink); }
.cv-chip-yellow { background: var(--yellow); color: var(--ink); }

/* filtros */
.cv-filters { display: flex; gap: 8px; flex-wrap: wrap; }
.cv-filter {
  font-family: 'Outfit', system-ui, sans-serif; font-size: 13.5px; font-weight: 600;
  padding: 9px 16px; border-radius: 999px; cursor: pointer;
  border: 1.5px solid rgba(17,17,17,.16); background: transparent; color: var(--ink-soft);
  transition: all .18s ease;
}
.cv-filter:hover { border-color: var(--ink); color: var(--ink); }
.cv-filter.is-on { background: var(--ink); border-color: var(--ink); color: var(--paper); }

/* logotipo */
.cv-mark { display: block; flex: none; }

/* cabe\xE7alho */
.cv-header { position: fixed; top: 0; left: 0; right: 0; z-index: 50; transition: background .2s linear, box-shadow .2s linear; contain: layout style; }
.cv-header.is-solid { background: var(--paper); box-shadow: none; }
.cv-header-inner { display: flex; align-items: center; gap: 20px; height: 72px; }
.cv-logo { display: flex; align-items: center; gap: 4px; }

.cv-logo-desc {
  font-size: 11px; color: var(--ink-soft); font-weight: 600; letter-spacing: .06em;
  max-width: 84px; line-height: 1.25; padding-left: 11px; margin-left: 2px;
  border-left: 1.5px solid rgba(17,17,17,.16);
}
@media (max-width: 1240px) { .cv-logo-desc { display: none; } }
.cv-nav { display: flex; gap: 2px; flex-wrap: nowrap; }
.cv-nav-link {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: 'Outfit', system-ui, sans-serif; font-size: 14px; font-weight: 500; color: var(--ink-soft);
  padding: 7px 10px; border-radius: 999px; background: none; border: none; cursor: pointer;
  white-space: nowrap; line-height: 1;
  transition: color .16s ease, background .16s ease;
}
@media (max-width: 1340px) { .cv-nav-link { font-size: 13.5px; padding: 7px 8px; } }
.cv-nav-link:hover { color: var(--ink); background: rgba(17,17,17,.05); }
.cv-nav-link.is-active { color: var(--ink); font-weight: 600; background: rgba(17,17,17,.08); }
.cv-header-ctas { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.cv-btn-enter { padding: 10px 16px; font-size: 14px; }
.cv-menu-btn {
  display: none; background: none; border: none; color: var(--ink);
  padding: 8px; cursor: pointer; margin-left: 8px;
}
@media (max-width: 1000px) { .cv-menu-btn { display: inline-flex; } .cv-header-ctas { margin-left: auto; } }
.cv-mobile-menu {
  background: var(--paper); border-top: 1px solid rgba(17,17,17,.12);
  padding: 12px 24px 24px; display: flex; flex-direction: column;
  box-shadow: none;
}
.cv-mobile-link {
  padding: 13px 4px; font-family: 'Outfit', system-ui, sans-serif; font-weight: 600; font-size: 15px;
  color: var(--ink); border-bottom: 1px solid rgba(17,17,17,.08);
  background: none; border-left: none; border-right: none; border-top: none;
  text-align: left; cursor: pointer;
}
.cv-mobile-ctas { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }

/* whatsapp */
.cv-root .cv-wa {
  position: fixed; right: 22px; bottom: 22px; z-index: 60;
  display: inline-flex; align-items: center; gap: 9px;
  background: #25D366; color: #fff; font-family: 'Outfit', system-ui, sans-serif;
  font-weight: 700; font-size: 14.5px; padding: 14px 20px; border-radius: 999px;
  box-shadow: none; transition: transform .18s ease, box-shadow .18s ease;
}
.cv-root .cv-wa:hover { transform: translateY(-3px); box-shadow: none; color: #fff; }

/* hero */
.cv-hero { padding: 128px 0 92px; overflow: hidden; }
.cv-hero-grid { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 56px; align-items: center; }
.cv-hero-title {
  font-family: 'Outfit', system-ui, sans-serif; font-size: clamp(42px, 6.4vw, 70px);
  font-weight: 600; line-height: 1.04; letter-spacing: -0.035em; color: var(--ink);
}
.cv-hl { position: relative; white-space: nowrap; z-index: 1; }
.cv-hl::after {
  content: ''; position: absolute; left: -2%; right: -2%; bottom: 6%; height: 42%;
  background: var(--yellow); z-index: -1; border-radius: 6px;
}
.cv-hero-sub { font-size: clamp(16px, 1.9vw, 18px); color: var(--ink-soft); max-width: 540px; margin-top: 22px; }
.cv-hero-actions { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 32px; }
.cv-stats { display: flex; gap: 34px; flex-wrap: wrap; margin-top: 54px; }
.cv-stats-tight { margin-top: 34px; }
.cv-stat { padding-left: 16px; border-left: 6px solid; border-radius: 3px; }
.cv-stat-blue { border-color: var(--blue); }
.cv-stat-orange { border-color: var(--orange); }
.cv-stat-green { border-color: var(--green); }
.cv-stat-ink { border-color: var(--ink); }
.cv-stat dt { font-size: 12.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-soft); }
.cv-stat dd { font-family: 'Outfit', system-ui, sans-serif; font-weight: 600; font-size: clamp(25px, 3vw, 36px); color: var(--ink); letter-spacing: -0.02em; }

.cv-mosaic { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; aspect-ratio: 3 / 4; width: 100%; max-width: 430px; justify-self: end; }
.cv-tile { position: relative; overflow: hidden; animation: cvTile .55s cubic-bezier(.22,.8,.3,1) both; }
@keyframes cvTile { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }
.cv-shape { position: absolute; inset: 0; }
.s-circle { border-radius: 50%; }
.s-q-tl { border-radius: 100% 0 0 0; } .s-q-tr { border-radius: 0 100% 0 0; }
.s-q-bl { border-radius: 0 0 0 100%; } .s-q-br { border-radius: 0 0 100% 0; }
.s-h-t { border-radius: 999px 999px 0 0; } .s-h-b { border-radius: 0 0 999px 999px; }
.s-h-l { border-radius: 999px 0 0 999px; } .s-h-r { border-radius: 0 999px 999px 0; }

/* alternador */
.cv-switch-wrap { display: flex; justify-content: center; margin-bottom: 52px; }
.cv-switch { position: relative; display: grid; grid-template-columns: 1fr 1fr; background: rgba(17,17,17,.07); border-radius: 999px; padding: 6px; width: min(420px, 100%); }
.cv-switch-thumb { position: absolute; top: 6px; bottom: 6px; left: 6px; width: calc(50% - 6px); background: var(--ink); border-radius: 999px; transition: transform .35s cubic-bezier(.22,.8,.3,1); box-shadow: none; }
.cv-switch-btn { position: relative; z-index: 1; border: none; background: none; cursor: pointer; font-family: 'Outfit', system-ui, sans-serif; font-weight: 600; font-size: 15px; padding: 12px 10px; color: var(--ink-soft); border-radius: 999px; transition: color .25s ease; }
.cv-switch-btn.is-on { color: var(--paper); }

/* problema */
.cv-problem { padding-top: 72px; }
.cv-problem-body { display: flex; flex-direction: column; gap: 40px; align-items: flex-start; }
.cv-problem-points { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; width: 100%; }
.cv-point { position: relative; overflow: hidden; background: #fff; padding: 30px 26px 26px; border: 1px solid rgba(17,17,17,.09); box-shadow: none; transition: transform .2s ease, box-shadow .2s ease; }
.cv-point:hover { transform: translateY(-4px); box-shadow: none; }
.cv-point-shape { position: absolute; top: 0; right: 0; width: 54px; height: 54px; border-radius: 0 0 0 100%; }
.cv-point-head { font-family: 'Outfit', system-ui, sans-serif; font-size: 18px; font-weight: 700; color: var(--ink); margin-bottom: 8px; max-width: 85%; letter-spacing: -0.015em; }
.cv-point-text { font-size: 15px; color: var(--ink-soft); }

/* pilares */
.cv-pillar-list { display: flex; flex-direction: column; gap: 24px; margin-top: 50px; }
.cv-pillar { position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 40px; border-radius: 6px; padding: 44px 48px; align-items: start; }
.cv-pillar:nth-child(even) { direction: rtl; }
.cv-pillar:nth-child(even) > * { direction: ltr; }
.cv-pillar-blue { background: var(--blue); color: var(--paper); }
.cv-pillar-yellow { background: var(--yellow); color: var(--ink); }
.cv-pillar-green { background: var(--green); color: var(--paper); }
.cv-pillar-num { position: absolute; right: -10px; bottom: -70px; z-index: 0; font-family: 'Outfit', system-ui, sans-serif; font-weight: 600; font-size: clamp(160px, 24vw, 280px); line-height: 1; letter-spacing: -0.05em; color: rgba(255,255,255,.22); pointer-events: none; user-select: none; }
.cv-pillar-yellow .cv-pillar-num { color: rgba(17,17,17,.08); }
.cv-pillar:nth-child(even) .cv-pillar-num { right: auto; left: -10px; direction: ltr; }
.cv-pillar-head, .cv-module-list { position: relative; z-index: 1; }
.cv-pillar-label { font-family: 'Outfit', system-ui, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .7; }
.cv-pillar-title { font-family: 'Outfit', system-ui, sans-serif; font-size: clamp(24px, 3vw, 32px); font-weight: 700; margin-top: 10px; line-height: 1.12; letter-spacing: -0.02em; }
.cv-pillar-intro { margin-top: 14px; font-size: 15px; opacity: .85; max-width: 380px; }
.cv-module-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.cv-module { display: flex; gap: 14px; align-items: flex-start; padding: 15px 18px; border-radius: 6px; transition: background .2s ease; }
.cv-pillar-blue .cv-module:hover, .cv-pillar-green .cv-module:hover { background: rgba(255,255,255,.12); }
.cv-pillar-yellow .cv-module:hover { background: rgba(17,17,17,.06); }
.cv-module-icon { flex: none; margin-top: 3px; opacity: .9; }
.cv-module-name { font-family: 'Outfit', system-ui, sans-serif; font-weight: 600; font-size: 16px; }
.cv-module-desc { font-size: 14px; opacity: .82; margin-top: 3px; }

/* vitrine */
.cv-vitrine { background: var(--blue); overflow: hidden; }
.cv-vitrine-deco { position: absolute; top: -120px; right: -120px; width: 340px; height: 340px; background: var(--blue-light); border-radius: 50%; opacity: .5; }
.cv-vitrine .cv-container { position: relative; z-index: 1; }
.cv-card-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
.cv-project { background: var(--paper); padding: 24px 22px; display: flex; flex-direction: column; gap: 12px; transition: transform .2s ease, box-shadow .2s ease; }
.cv-project:hover { transform: translateY(-5px); box-shadow: none; }
.cv-project-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.cv-project-city { font-size: 12.5px; color: var(--ink-soft); font-weight: 500; }
.cv-project-name { font-family: 'Outfit', system-ui, sans-serif; font-size: 20px; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; }
.cv-project-desc { font-size: 14px; color: var(--ink-soft); flex: 1; }
.cv-project-meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-soft); }
.cv-project-meta strong { color: var(--ink); }
.cv-project-pct { color: var(--blue); font-weight: 700; }

/* painel */
.cv-dash-grid { display: grid; grid-template-columns: minmax(0,5fr) minmax(0,7fr); gap: 56px; align-items: center; }
.cv-dash-list { list-style: none; padding: 0; margin-top: 26px; display: flex; flex-direction: column; gap: 12px; }
.cv-dash-list li { display: flex; gap: 10px; align-items: center; font-size: 15px; color: var(--ink); font-weight: 500; }
.cv-dash-list svg { color: var(--green); flex: none; }
.cv-browser { background: #fff; border-radius: 6px; overflow: hidden; box-shadow: none; border: 1px solid rgba(17,17,17,.10); }
.cv-browser-bar { display: flex; align-items: center; gap: 7px; padding: 12px 16px; background: rgba(17,17,17,.05); border-bottom: 1px solid rgba(17,17,17,.08); }
.cv-browser-bar span { width: 10px; height: 10px; border-radius: 50%; }
.cv-browser-bar span:nth-child(1) { background: var(--orange); }
.cv-browser-bar span:nth-child(2) { background: var(--yellow); }
.cv-browser-bar span:nth-child(3) { background: var(--green); }
.cv-browser-bar p { margin-left: 10px; font-size: 12px; color: var(--ink-soft); background: #fff; border-radius: 8px; padding: 4px 12px; flex: 1; border: 1px solid rgba(17,17,17,.08); }
.cv-browser-body { padding: 24px; }
.cv-dash-title-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.cv-dash-kicker { font-family: 'Outfit', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--orange); }
.cv-dash-title { font-family: 'Outfit', system-ui, sans-serif; font-size: 21px; color: var(--ink); font-weight: 700; letter-spacing: -0.02em; }
.cv-phase-row { display: flex; gap: 6px; margin: 22px 0; flex-wrap: wrap; }
.cv-phase { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: 999px; border: 1px solid rgba(17,17,17,.12); color: var(--ink-soft); background: rgba(17,17,17,.03); }
.cv-phase-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(17,17,17,.22); }
.cv-phase-done { color: var(--green); }
.cv-phase-done .cv-phase-dot { background: var(--green); }
.cv-phase-active { color: #fff; background: var(--blue); border-color: var(--blue); }
.cv-phase-active .cv-phase-dot { background: var(--yellow); }
.cv-dash-cols { display: grid; grid-template-columns: minmax(0,7fr) minmax(0,5fr); gap: 16px; }
.cv-dash-box { border: 1px solid rgba(17,17,17,.10); border-radius: 6px; padding: 16px; background: rgba(255,255,255,.6); }
.cv-dash-box-title { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-soft); margin-bottom: 12px; }
.cv-task-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.cv-task { display: flex; gap: 9px; align-items: flex-start; font-size: 13.5px; color: var(--ink); }
.cv-task svg { flex: none; margin-top: 2px; }
.cv-task.is-done span { text-decoration: line-through; color: var(--ink-soft); }
.cv-task-done { color: var(--green); } .cv-task-doing { color: var(--orange); } .cv-task-todo { color: rgba(17,17,17,.35); }
.cv-dash-big { font-family: 'Outfit', system-ui, sans-serif; font-size: 23px; font-weight: 700; color: var(--ink); margin-bottom: 10px; letter-spacing: -0.02em; }
.cv-dash-big span { font-family: 'Outfit', system-ui, sans-serif; font-size: 13px; color: var(--ink-soft); font-weight: 500; }
.cv-dash-foot { font-size: 12.5px; color: var(--ink-soft); margin-top: 10px; }

/* atalhos */
.cv-teaser-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 44px; }
.cv-teaser { overflow: hidden; transition: transform .2s ease, box-shadow .2s ease; }
.cv-teaser:hover { transform: translateY(-5px); box-shadow: none; }
.cv-teaser-inner { display: flex; flex-direction: column; gap: 8px; padding: 28px 24px; height: 100%; }
.cv-teaser-tag { font-family: 'Outfit', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .75; margin-top: 8px; }
.cv-teaser-title { font-family: 'Outfit', system-ui, sans-serif; font-size: 19px; font-weight: 700; line-height: 1.2; letter-spacing: -0.02em; }
.cv-teaser-desc { font-size: 14px; opacity: .85; flex: 1; }
.cv-teaser-go { display: inline-flex; align-items: center; gap: 5px; font-family: 'Outfit', system-ui, sans-serif; font-weight: 700; font-size: 14px; margin-top: 6px; }

/* equipe */
.cv-team { background: var(--green-deep); border-radius: 0; overflow: hidden; }
.cv-team-num { position: absolute; right: -20px; top: 50%; transform: translateY(-50%); font-family: 'Outfit', system-ui, sans-serif; font-weight: 600; font-size: clamp(200px, 30vw, 380px); line-height: 1; letter-spacing: -0.06em; color: transparent; -webkit-text-stroke: 3px rgba(255,255,255,.18); pointer-events: none; user-select: none; }
.cv-team-grid { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0,6fr) minmax(0,6fr); gap: 56px; align-items: center; }

.cv-plan.is-featured { background: var(--blue); color: var(--paper); border-color: var(--blue); box-shadow: none; transform: scale(1.03); }
.cv-plan.is-featured:hover { transform: scale(1.03) translateY(-5px); }
.cv-plan-badge { position: absolute; top: -13px; left: 26px; background: var(--yellow); color: var(--ink); font-family: 'Outfit', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; }
.cv-plan-name { font-family: 'Outfit', system-ui, sans-serif; font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
.cv-plan-price { font-family: 'Outfit', system-ui, sans-serif; font-size: 31px; font-weight: 600; margin-top: 10px; letter-spacing: -0.03em; }
.cv-plan-price span { font-family: 'Outfit', system-ui, sans-serif; font-size: 13.5px; font-weight: 500; opacity: .75; margin-left: 2px; }
.cv-plan-year { font-size: 12.5px; opacity: .7; margin-top: 2px; }
.cv-plan-desc { font-size: 14px; opacity: .82; margin-top: 8px; }
.cv-plan-items { list-style: none; padding: 0; margin: 20px 0 26px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.cv-plan-items li { display: flex; gap: 9px; align-items: flex-start; font-size: 14px; }
.cv-plan-items svg { flex: none; margin-top: 3px; color: var(--green); }
.cv-plan.is-featured .cv-plan-items svg { color: var(--yellow); }
.cv-plan-cta { justify-content: center; }
.cv-plan.is-featured .cv-btn-outline { border-color: var(--paper); color: var(--paper); }
.cv-table-wrap { overflow-x: auto; margin-top: 40px; border-radius: 6px; border: 1px solid rgba(17,17,17,.10); background: #fff; }
.cv-table { width: 100%; border-collapse: collapse; min-width: 680px; }
.cv-table th, .cv-table td { padding: 15px 18px; text-align: center; font-size: 14px; border-bottom: 1px solid rgba(17,17,17,.08); }
.cv-table thead th { font-family: 'Outfit', system-ui, sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink); background: rgba(17,17,17,.04); }
.cv-table tbody th { text-align: left; font-weight: 600; font-size: 14px; color: var(--ink); }
.cv-table .cv-th-hi { background: var(--blue); color: var(--paper); }
.cv-table .cv-td-hi { background: rgba(29,111,224,.06); }
.cv-tbl-yes { color: var(--green); }
.cv-tbl-no { color: rgba(17,17,17,.28); }
.cv-tbl-txt { font-size: 13px; color: var(--ink-soft); font-weight: 500; }
.cv-billing-grid { display: grid; grid-template-columns: minmax(0,7fr) minmax(0,5fr); gap: 22px; align-items: start; }
.cv-help { background: var(--ink); color: var(--paper); border-radius: 6px; padding: 34px 32px; }
.cv-help-title { font-family: 'Outfit', system-ui, sans-serif; font-size: 23px; font-weight: 700; letter-spacing: -0.02em; }
.cv-help-text { font-size: 15px; color: rgba(255,255,255,.82); margin: 12px 0 22px; }
.cv-help-note { font-size: 12.5px; color: rgba(255,255,255,.55); margin-top: 22px; border-top: 1px solid rgba(255,255,255,.15); padding-top: 16px; }

/* formul\xE1rios e autentica\xE7\xE3o */
.cv-field { display: flex; flex-direction: column; gap: 7px; }
.cv-field-label { font-family: 'Outfit', system-ui, sans-serif; font-size: 13px; font-weight: 600; color: var(--ink); }
.cv-field-wrap { position: relative; display: flex; align-items: center; }
.cv-field-icon { position: absolute; left: 16px; color: var(--ink-soft); pointer-events: none; }
.cv-field-eye { position: absolute; right: 12px; background: none; border: none; color: var(--ink-soft); cursor: pointer; padding: 6px; display: flex; }
.cv-input {
  width: 100%; font-family: 'Outfit', system-ui, sans-serif; font-size: 15px; color: var(--ink);
  padding: 13px 16px; border-radius: 6px; border: 1.5px solid rgba(17,17,17,.16);
  background: #fff; transition: border-color .18s ease, box-shadow .18s ease;
}
.cv-input:focus { outline: none; border-color: var(--blue); box-shadow: none; }
.cv-input::placeholder { color: rgba(17,17,17,.38); }
.cv-field-hint { font-size: 12.5px; color: var(--ink-soft); }
.cv-form { display: flex; flex-direction: column; gap: 18px; margin-top: 26px; }
.cv-form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.cv-form-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 14px; }
.cv-form-nav { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
.cv-form-msg { font-size: 13.5px; color: var(--ink-soft); background: rgba(29,111,224,.08); border-radius: 6px; padding: 12px 14px; }
.cv-check { display: inline-flex; align-items: flex-start; gap: 9px; font-size: 14px; color: var(--ink-soft); cursor: pointer; }
.cv-check input { margin-top: 3px; accent-color: var(--blue); width: 16px; height: 16px; }

.cv-auth { display: grid; grid-template-columns: minmax(0,5fr) minmax(0,7fr); min-height: 100vh; }
.cv-authart { position: relative; overflow: hidden; display: flex; align-items: center; padding: 56px 48px; }
.cv-authart-blue { background: var(--blue); }
.cv-authart-yellow { background: var(--yellow); }
.cv-authart-green { background: var(--green); }
.cv-authart-shape { position: absolute; pointer-events: none; }
.cv-aa-1 { width: 220px; height: 220px; border-radius: 50%; background: rgba(255,255,255,.18); top: -60px; left: -70px; }
.cv-aa-2 { width: 180px; height: 90px; border-radius: 999px 999px 0 0; background: rgba(255,255,255,.16); bottom: 0; right: 30px; }
.cv-aa-3 { width: 130px; height: 130px; border-radius: 0 100% 0 0; background: rgba(255,255,255,.14); top: 40%; right: -40px; }
.cv-authart-body { position: relative; z-index: 1; }
.cv-authart-logo { display: flex; align-items: center; margin-bottom: 28px; }
.cv-authart-title { font-family: 'Outfit', system-ui, sans-serif; font-size: clamp(26px, 3.2vw, 38px); font-weight: 600; line-height: 1.1; letter-spacing: -0.03em; max-width: 340px; }
.cv-authart-list { list-style: none; padding: 0; margin-top: 26px; display: flex; flex-direction: column; gap: 12px; }
.cv-authart-list li { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; font-weight: 500; }
.cv-authart-list svg { flex: none; margin-top: 3px; }
.cv-authart-blue, .cv-authart-green { color: var(--paper); }
.cv-authart-yellow { color: var(--ink); }
.cv-authform { padding: 56px 64px; display: flex; flex-direction: column; justify-content: center; max-width: 620px; width: 100%; }
.cv-back { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; color: var(--ink-soft); margin-bottom: 28px; width: fit-content; }
.cv-back:hover { color: var(--ink); }
.cv-auth-title { font-family: 'Outfit', system-ui, sans-serif; font-size: clamp(28px, 3.6vw, 38px); font-weight: 600; letter-spacing: -0.03em; color: var(--ink); }
.cv-auth-sub { font-size: 15px; color: var(--ink-soft); margin-top: 10px; max-width: 460px; }
.cv-auth-alt { font-size: 14px; color: var(--ink-soft); margin-top: 4px; }
.cv-steps-bar { list-style: none; padding: 0; display: flex; gap: 8px; margin-top: 26px; flex-wrap: wrap; }
.cv-sb { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--ink-soft); padding: 8px 14px 8px 8px; border-radius: 999px; background: rgba(17,17,17,.05); }
.cv-sb-dot { width: 22px; height: 22px; border-radius: 50%; background: rgba(17,17,17,.14); color: var(--ink); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
.cv-sb.is-on { background: var(--ink); color: var(--paper); }
.cv-sb.is-on .cv-sb-dot { background: var(--yellow); color: var(--ink); }
.cv-sb.is-done .cv-sb-dot { background: var(--green); color: #fff; }
.cv-confirm { background: rgba(31,157,85,.07); border: 1px solid rgba(31,157,85,.25); border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.cv-confirm-title { display: flex; align-items: center; gap: 8px; font-family: 'Outfit', system-ui, sans-serif; font-weight: 700; font-size: 16px; color: var(--green); }
.cv-confirm-list { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.cv-confirm-list dt { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-soft); }
.cv-confirm-list dd { font-size: 14.5px; font-weight: 600; color: var(--ink); margin-top: 2px; }

@media (max-width: 980px) {
  .cv-academy-grid, .cv-post-grid, .cv-inst-grid, .cv-partner-grid, .cv-trilha-grid,
  .cv-steps, .cv-safety { grid-template-columns: repeat(2, 1fr); }
  .cv-teacher-grid, .cv-plan-grid { grid-template-columns: repeat(2, 1fr); }
  .cv-plan.is-featured { transform: none; }
  .cv-plan.is-featured:hover { transform: translateY(-5px); }
  .cv-featured, .cv-blog-lower, .cv-newsletter, .cv-billing-grid { grid-template-columns: 1fr; }
  .cv-featured-art { min-height: 160px; }
  .cv-auth { grid-template-columns: 1fr; min-height: auto; }
  .cv-authart { padding: 44px 32px; }
  .cv-authform { padding: 44px 32px; max-width: 100%; }
  .cv-trilhas, .cv-steps-sec { border-radius: 6px; }
}
@media (max-width: 640px) {
  .cv-pagehero { padding: 118px 0 52px; }
  .cv-academy-grid, .cv-post-grid, .cv-inst-grid, .cv-partner-grid, .cv-trilha-grid,
  .cv-steps, .cv-safety, .cv-teacher-grid, .cv-plan-grid { grid-template-columns: 1fr; }
  .cv-form-2col, .cv-confirm-list { grid-template-columns: 1fr; }
  .cv-featured-body { padding: 28px 24px; }
  .cv-list-head { flex-direction: column; align-items: flex-start; }
}

/* ---- desempenho: revela\xE7\xE3o instant\xE2nea ---- */
.cv-reveal.is-instant { opacity: 1; transform: none; transition: none; }

/* ---- empresas parceiras (faixa) ---- */
.cv-partners-ink { background: var(--ink); }
.cv-logos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.cv-logoitem {
  display: flex; flex-direction: column; gap: 6px; padding: 22px 20px;
  background: #fff; border: 1px solid rgba(17,17,17,.10); border-radius: 6px;
  transition: transform .18s ease, box-shadow .18s ease;
}
.cv-logoitem:hover { transform: translateY(-4px); box-shadow: none; }
.cv-logodot { width: 26px; height: 26px; border-radius: 999px 4px 999px 999px; display: inline-block; }
.cv-logodot-lg { width: 38px; height: 38px; flex: none; }
.cv-logotext { font-family: 'Outfit', system-ui, sans-serif; font-size: 17px; font-weight: 500; color: var(--ink); letter-spacing: -0.02em; }
.cv-logotext strong { font-weight: 600; margin-right: 4px; }
.cv-logosector { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); }

/* ---- portal da empresa ---- */
.cv-pagehero-green { background: var(--green); }
.cv-pagehero-blue { background: var(--blue); }
.cv-pagehero .cv-hero-actions { margin-top: 28px; }
.cv-why-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 44px; }
.cv-why { background: #fff; border: 1px solid rgba(17,17,17,.09); padding: 26px 24px; display: flex; flex-direction: column; gap: 10px; transition: transform .2s ease, box-shadow .2s ease; }
.cv-why:hover { transform: translateY(-4px); box-shadow: none; }
.cv-why-badge { width: 42px; height: 42px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #fff; }
.cv-why-title { font-family: 'Outfit', system-ui, sans-serif; font-size: 17.5px; font-weight: 700; color: var(--ink); letter-spacing: -0.015em; line-height: 1.25; }
.cv-why-desc { font-size: 14px; color: var(--ink-soft); }
.cv-disclaimer { margin-top: 28px; font-size: 13px; color: var(--ink-soft); border-left: 4px solid var(--orange); padding-left: 16px; max-width: 660px; }
.cv-steps-4 { grid-template-columns: repeat(4, 1fr); }
.cv-portal-head { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; padding-bottom: 18px; border-bottom: 1px solid rgba(17,17,17,.08); }
.cv-portal-brand { display: flex; align-items: center; gap: 12px; }
.cv-portal-name { font-family: 'Outfit', system-ui, sans-serif; font-size: 20px; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; }
.cv-portal-sub { font-size: 13px; color: var(--ink-soft); }
.cv-portal-metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 22px 0 14px; }
.cv-portal-metrics div { display: flex; flex-direction: column; gap: 2px; }
.cv-portal-metrics span { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); }
.cv-portal-metrics strong { font-family: 'Outfit', system-ui, sans-serif; font-size: 21px; font-weight: 600; color: var(--ink); letter-spacing: -0.02em; }
.cv-portal-criteria { margin-top: 24px; }
.cv-crit-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.cv-portal-table { margin-top: 26px; }
.cv-prop-row { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; padding: 13px 0; border-bottom: 1px solid rgba(17,17,17,.08); }
.cv-prop-row:last-child { border-bottom: none; }
.cv-prop-row strong { display: block; font-size: 14.5px; font-weight: 600; color: var(--ink); }
.cv-prop-row > div span { font-size: 12.5px; color: var(--ink-soft); }
.cv-prop-value { font-family: 'Outfit', system-ui, sans-serif; font-size: 14.5px; font-weight: 700; color: var(--ink); }
.cv-prop-status { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 5px 11px; border-radius: 999px; white-space: nowrap; }
.cv-prop-status.is-blue { background: rgba(29,111,224,.12); color: var(--blue); }
.cv-prop-status.is-green { background: rgba(31,157,85,.14); color: var(--green); }
.cv-prop-status.is-gray { background: rgba(17,17,17,.08); color: var(--ink-soft); }

/* ---- banco de talentos ---- */
.cv-tabsbar { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; margin-bottom: 28px; }
.cv-tabs { display: inline-flex; gap: 4px; background: rgba(17,17,17,.06); padding: 5px; border-radius: 999px; flex-wrap: wrap; }
.cv-tab { font-family: 'Outfit', system-ui, sans-serif; font-size: 14px; font-weight: 600; padding: 10px 20px; border-radius: 999px; border: none; background: none; color: var(--ink-soft); cursor: pointer; transition: all .18s ease; }
.cv-tab:hover { color: var(--ink); }
.cv-tab.is-on { background: var(--ink); color: var(--paper); }
.cv-flash { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--green); background: rgba(31,157,85,.10); border-radius: 6px; padding: 13px 16px; margin-bottom: 22px; }
.cv-publish { background: #fff; border: 1px solid rgba(17,17,17,.12); border-radius: 6px; padding: 28px 26px; margin-bottom: 30px; }
.cv-publish-title { font-family: 'Outfit', system-ui, sans-serif; font-size: 19px; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; margin-bottom: 20px; }
.cv-publish-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
.cv-vaga-list { display: flex; flex-direction: column; gap: 14px; }
.cv-vaga { display: grid; grid-template-columns: 1fr auto auto; gap: 22px; align-items: center; background: #fff; border: 1px solid rgba(17,17,17,.09); border-radius: 6px; padding: 22px 26px; transition: transform .18s ease, box-shadow .18s ease; }
.cv-vaga:hover { transform: translateY(-3px); box-shadow: none; }
.cv-vaga-main { display: flex; flex-direction: column; gap: 7px; }
.cv-vaga-title { font-family: 'Outfit', system-ui, sans-serif; font-size: 19px; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; }
.cv-vaga-sub { font-size: 13.5px; color: var(--ink-soft); }
.cv-vaga-meta { text-align: right; }
.cv-vaga-cache { font-family: 'Outfit', system-ui, sans-serif; font-size: 16px; font-weight: 700; color: var(--blue); }
.cv-vaga-prazo { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--ink-soft); margin-top: 3px; }
.cv-port-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
.cv-port { background: #fff; border: 1px solid rgba(17,17,17,.09); overflow: hidden; display: flex; flex-direction: column; transition: transform .2s ease, box-shadow .2s ease; }
.cv-port:hover { transform: translateY(-5px); box-shadow: none; }
.cv-port-art { position: relative; height: 130px; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.9); overflow: hidden; }
.cv-port-art-shape { position: absolute; width: 110px; height: 110px; border-radius: 100% 0 0 0; background: rgba(255,255,255,.18); right: 0; bottom: 0; }
.cv-port-body { padding: 20px 22px 24px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.cv-port-title { font-family: 'Outfit', system-ui, sans-serif; font-size: 18px; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; line-height: 1.25; }
.cv-port-role { font-size: 13.5px; color: var(--ink-soft); flex: 1; }
.cv-port-author { font-size: 12.5px; font-weight: 600; color: var(--blue); }

/* ---- planos: limites ---- */
.cv-plan-limits { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 4px; }
.cv-plan-limits li { font-size: 11.5px; font-weight: 600; padding: 4px 9px; border-radius: 999px; background: rgba(17,17,17,.07); color: var(--ink); }
.cv-plan.is-featured .cv-plan-limits li { background: rgba(255,255,255,.16); color: var(--paper); }
.cv-plan-items { margin-top: 16px; }

@media (max-width: 980px) {
  .cv-logos, .cv-why-grid, .cv-port-grid { grid-template-columns: repeat(2, 1fr); }
  .cv-steps-4 { grid-template-columns: repeat(2, 1fr); }
  .cv-portal-metrics { grid-template-columns: repeat(2, 1fr); }
  .cv-publish-grid { grid-template-columns: repeat(2, 1fr); }
  .cv-teaser-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 700px) {
  .cv-logos, .cv-why-grid, .cv-port-grid, .cv-steps-4, .cv-publish-grid { grid-template-columns: 1fr; }
  .cv-vaga { grid-template-columns: 1fr; gap: 14px; }
  .cv-vaga-meta { text-align: left; }
  .cv-prop-row { grid-template-columns: 1fr auto; }
  .cv-prop-status { grid-column: 2; }
  .cv-tabs { width: 100%; }
  .cv-tab { flex: 1; padding: 10px 12px; }
}

/* cards de profissionais do Banco de Talentos */
.cv-talent-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
.cv-talent-role { font-size: 13.5px; font-weight: 600; color: var(--blue); margin-top: 3px; }
.cv-talent-city { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--ink-soft); margin-top: 6px; }
.cv-skill-list { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 8px; }
.cv-skill-list li { font-size: 11.5px; font-weight: 600; color: var(--ink); background: rgba(17,17,17,.06); padding: 4px 9px; border-radius: 999px; }
.cv-partners { overflow: hidden; }

@media (max-width: 980px) { .cv-talent-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) { .cv-talent-grid { grid-template-columns: 1fr; } }

/* servi\xE7os avulsos */
.cv-svc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 40px; }
.cv-svc { background: #fff; border: 1px solid rgba(17,17,17,.09); padding: 26px 22px; display: flex; flex-direction: column; gap: 9px; transition: transform .2s ease, box-shadow .2s ease; }
.cv-svc:hover { transform: translateY(-4px); box-shadow: none; }
.cv-svc-name { font-family: 'Outfit', system-ui, sans-serif; font-size: 17px; font-weight: 700; color: var(--ink); line-height: 1.25; letter-spacing: -0.015em; }
.cv-svc-price { font-family: 'Outfit', system-ui, sans-serif; font-size: 25px; font-weight: 600; color: var(--blue); letter-spacing: -0.025em; }
.cv-svc-price span { font-family: 'Outfit', system-ui, sans-serif; font-size: 13px; font-weight: 500; color: var(--ink-soft); }
.cv-svc-desc { font-size: 13.5px; color: var(--ink-soft); flex: 1; }
.cv-svc-note { font-size: 12px; color: var(--ink-soft); border-top: 1px solid rgba(17,17,17,.08); padding-top: 10px; }

/* planos de empresa */
.cv-corp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 40px; align-items: stretch; }
.cv-corp { background: #fff; border: 1px solid rgba(17,17,17,.09); padding: 30px 26px; display: flex; flex-direction: column; transition: transform .2s ease, box-shadow .2s ease; }
.cv-corp:hover { transform: translateY(-5px); box-shadow: none; }
.cv-corp.is-featured { background: var(--green); color: var(--paper); border-color: var(--green); box-shadow: none; }

.cv-shop-item, .cv-cred, .cv-trilha, .cv-dash-box, .cv-browser, .cv-capt-table, .cv-logoitem, .cv-course, .cv-teacher {
  border: 1px solid var(--line) !important; background: #fff;
}
.cv-steps-sec, .cv-ponte, .cv-problem { background: var(--sand) !important; }
.cv-gestao, .cv-team { background: var(--ink) !important; border-radius: 0 !important; }
.cv-band { border-radius: 6px !important; }
.cv-band-lilac { background: var(--sand) !important; border: 1px solid var(--line); }
.cv-plan.is-featured { background: var(--ink) !important; border-color: var(--ink) !important; }
.cv-plan-badge { background: var(--yellow) !important; color: var(--ink) !important; border-radius: 4px !important; }
.cv-chip { border-radius: 4px !important; }
.cv-wa { border-radius: 6px !important; background: #111 !important; }
.cv-wa:hover { transform: none !important; }
/* logo */
.cv-lockup { display: inline-flex; align-items: center; gap: 12px; color: inherit; }
.cv-lockup-rule { width: 1.5px; align-self: stretch; background: currentColor; opacity: .9; margin: 2px 0; }
.cv-lockup-text { font-family: 'Outfit', system-ui, sans-serif; font-weight: 500; line-height: 1.05; font-size: 15px; white-space: nowrap; }
/* eixos */
.cv-eixos { display: flex; flex-wrap: wrap; gap: 8px; }
.cv-eixo-chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border: 1.5px solid var(--ink); border-radius: 999px; font-size: 14px; font-weight: 500; background: #fff; color: var(--ink); }
.cv-eixo-chip b { display: inline-flex; width: 24px; height: 24px; border-radius: 50%; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--ink); }
.cv-eixo-chip.is-dim { opacity: .55; }
.cv-eixomark { display: inline-flex; align-items: center; gap: 18px; color: var(--ink); }
.cv-eixomark-rule { width: 2px; align-self: stretch; background: var(--ink); }
.cv-eixomark-n { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
.cv-eixomark-name { font-size: clamp(28px, 4vw, 44px); font-weight: 500; line-height: 1; margin-top: 4px; }
.cv-pagehero-deco { position: absolute; right: max(24px, calc((100vw - 1180px) / 2)); top: 50%; transform: translateY(-30%); z-index: 1; }
@media (max-width: 980px) { .cv-pagehero-deco { display: none; } }
.cv-pagehero-yellow .cv-pagetitle, .cv-pagehero-yellow .cv-lead, .cv-pagehero-green .cv-lead { color: var(--ink) !important; }
.cv-pagehero-green .cv-pagetitle, .cv-pagehero-green .cv-eyebrow { color: var(--ink) !important; }
.cv-stats-src { display: inline-block; margin-top: 18px; font-size: 12.5px; color: var(--ink-soft); border: 1px dashed #C8C8C8; padding: 4px 10px; border-radius: 4px; }

.cv-stat-yellow { border-color: var(--yellow); }
.cv-stats { gap: 28px 40px; }
.cv-stat dd { font-weight: 600 !important; }
.cv-heroeixos { list-style: none; padding: 0; margin: 28px 0 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 18px; max-width: 560px; }
.cv-heroeixos li { display: flex; align-items: center; gap: 10px; }
.cv-heroeixos b { flex: none; width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--ink); }
.cv-heroeixos strong { display: block; font-weight: 600; font-size: 15px; line-height: 1.2; }
.cv-heroeixos em { display: block; font-style: normal; font-size: 13px; color: var(--ink-soft); line-height: 1.25; }
@media (max-width: 640px) { .cv-heroeixos { grid-template-columns: 1fr; } }

/* ===== menos ornamento ===== */
.cv-pillar-num, .cv-team-num, .cv-vitrine-deco, .cv-academy-deco { display: none !important; }
.cv-hero .cv-stats { flex-wrap: nowrap; gap: 32px; margin-top: 40px; }
.cv-hero .cv-stat { border-left-width: 3px; padding-left: 12px; }
.cv-hero .cv-stat dt { font-size: 11.5px; letter-spacing: .04em; white-space: nowrap; }
.cv-hero .cv-stat dd { font-size: clamp(24px, 2.6vw, 32px); }
.cv-eyebrow { letter-spacing: .08em !important; }
@media (max-width: 640px) { .cv-hero .cv-stats { flex-wrap: wrap; gap: 18px 24px; } }
